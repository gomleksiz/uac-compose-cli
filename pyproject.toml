[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uac-compose"
version = "0.3.0"
description = "Export Stonebranch UAC definitions to readable .uac.yaml bundles and import them back"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Talk to the controller's REST API in this process (`ApiTransport`), with no
# `uac` CLI installed: what a Universal Extension needs. Only the client's
# generic get/post/put/delete are used, the same since 0.4.
api = ["uac-api>=0.4"]

[project.urls]
Documentation = "https://uac-compose-cli.readthedocs.io/en/latest/"
Source = "https://github.com/gomleksiz/uac-compose-cli"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
uac-compose = "uac_compose.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uac_compose"]

# The read-only seed data travels inside the wheel, so an install needs no
# checkout. The corpus (UAC_COMPOSE_CORPUS) is real production data and never ships.
[tool.hatch.build.targets.wheel.force-include]
"data" = "uac_compose/_data"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "data", "docs", "examples", "scripts", "Makefile", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["uac_compose"]
mypy_path = "src"
strict = true

# `uac-api` (the optional `api` extra) ships no type information.
[[tool.mypy.overrides]]
module = ["uac_api", "uac_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Corpus tests run over the real exports at UAC_COMPOSE_CORPUS: slow, and skipped when
# the corpus is absent. `make test-corpus` runs them.
addopts = "-q -m 'not corpus and not live'"
markers = [
    "corpus: runs over the real export corpus at UAC_COMPOSE_CORPUS (slow)",
    "live: talks to a real controller; opt in with UAC_COMPOSE_LIVE_PROFILE",
]
