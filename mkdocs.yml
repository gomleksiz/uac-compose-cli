site_name: uac-compose
site_url: https://uac-compose-cli.readthedocs.io/en/latest/
site_description: Stonebranch UAC definitions as readable .uac.yaml files, and changes in place
repo_url: https://github.com/gomleksiz/uac-compose-cli
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - mkdocs-click

nav:
  - Home: index.md
  - Install and set up: install.md
  - Guides:
      - Export and import: guide/export-import.md
      - Filters and find: guide/filters.md
      - "Change files: apply": guide/apply.md
      - Universal Extensions: guide/extensions.md
  - Cookbook: COOKBOOK.md
  - Reference:
      - Commands: reference/commands.md
      - File format: FORMAT.md
      - Specification: SPEC.md
  - Development:
      - Development plan: DEVELOPMENT-PLAN.md
      - Lessons: LESSONS.md
