      required: cond
      group: execution
    exitCodes:
      label: Exit Codes
      category: Result processing
      format: 1,5,22-30
      default: '0'
      applies_when:
        resultProcessing:
        - Success Exitcode Range
        - Failure Exitcode Range
      group: exit_codes
    maxRows:
      label: Maximum Rows
      category: Result processing
      kind: integer
      group: exit_codes
    resultProcessing:
      category: Result processing
      default: Skip Result Processing
      label: Result Processing
      kind: enum
