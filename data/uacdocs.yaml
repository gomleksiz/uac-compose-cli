# Distilled once from the Stonebranch AI 2.0 field documentation (not in
# this repo). Edit it by hand; `make check` tests it against the registry.
#
# scopes: fields of the shared skills; a type gets a scope's field only if
#   the registry declares it on that type.
# types:  per-type fields from the agent doc; `include` names the scopes.
# values: name -> integer id; the name is what GET returns and what yarb
#   writes. ui_labels: UI label -> name, only where they differ.
# applies_when / required_when: {field: [values]}; null = absent;
#   {field: {not: [values]}} negates.
categories:
  General: general
  Retry Options: retry
  Wait / Delay Options: wait
  Time Options / Late Start: time.late_start
  Time Options / Late Finish: time.late_finish
  Time Options / Early Finish: time.early_finish
  Time Options / Estimated duration: time
  Critical Path Options: critical_path
  Execution Options: restriction
  Self-Service Options: self_service
  Agent Selection: execution
  Credentials: execution
  Command vs Script: null
  Command Execution Options: command_options
  Exit-Code Processing: exit_codes
  Automatic Output Retrieval: output
  Retry Exit Codes: retry
  Database connection: execution
  Database credentials: execution
  Result processing: exit_codes
scopes:
  agent_task:
    agent:
      label: Agent
      category: Agent Selection
      kind: text
      required: cond
      group: execution
    agentCluster:
