types:
  taskApplicationControl:
    doc: null
    include:
    - common
  taskApproval:
    include:
    - common
    exclude:
    - credentials
    - credentialsVar
    - retryIndefinitely
    - retryInterval
    - retryMaximum
    - retrySuppressFailure
    fields:
      approvalCriteria:
        label: Approval Criteria
        section: Step 3 - Approval Details (task-type-specific fields)
        kind: object
        required: true
      approvalDescription:
        label: Approval Description
        section: Step 3 - Approval Details (task-type-specific fields)
        kind: text
      approvalLinks:
        label: Approval Links / References
        section: Step 3 - Approval Details (task-type-specific fields)
        kind: list
    sub_objects:
      approvalCriteria:
        logicalOperator:
          section: '`approvalCriteria` (required)'
          default: And
  taskEmail:
    include:
    - common
    exclude:
    - credentials
    - credentialsVar
    - retryIndefinitely
    - retryInterval
    - retryMaximum
    - retrySuppressFailure
    fields:
      attachLocalFile:
        label: Attach Local File
        section: 3c. Attachments (optional)
        kind: boolean
      bccRecipients:
        label: Bcc
        section: 3b. Recipients and content
        kind: text
        required: cond
      body:
        label: Body
        section: 3b. Recipients and content
        kind: text
      ccRecipients:
        label: Cc
        section: 3b. Recipients and content
        kind: text
        required: cond
      connection:
        label: Email Connection
        section: 3a. Connection or template
        kind: text
        required: cond
      listReportFormat:
        label: List Report Format
        section: 3c. Attachments (optional)
        kind: enum
        values:
          PDF: 1
          XML: 2
          JSON: 3
          CSV: 4
          TSV: 5
        default: PDF
      localAttachment:
        label: Local Attachment
        section: 3c. Attachments (optional)
        kind: text
        required: cond
      replyTo:
        label: Reply-To
        section: 3b. Recipients and content
        kind: text
      report:
        label: Report
        section: 3c. Attachments (optional)
        kind: object
      reportVar:
        label: Report Unresolved
        section: 3c. Attachments (optional)
        kind: text
      saveToSentItems:
        label: Save To Sent Items
        section: 3d. Other
        kind: enum
        values:
          Default: -1
          'No': 0
          'Yes': 1
      subject:
        label: Subject
        section: 3b. Recipients and content
        kind: text
      template:
        label: Email Template
        section: 3a. Connection or template
        kind: text
        required: cond
      templateVar:
        label: Email Template Unresolved
        section: 3a. Connection or template
        kind: text
        required: cond
      toRecipients:
        label: To
        section: 3b. Recipients and content
        kind: text
        required: cond
  taskEmailMonitor:
    include:
    - common
    fields:
      action:
        label: Action
        section: 3c. Mailbox and post-action
        kind: enum
        values:
          Mark As Read: 1
          Delete: 2
          Delete/Mark As Read: 3
          Move: 4
          Move/Mark As Read: 5
        default: Mark As Read
      bodyVariables:
        section: 3d. Body variables and content processing (optional)
        kind: enum
        values:
          None: 0
          Within Body: 1
          Within Default Markers: 2
          Within Custom Markers: 3
        default: None
      connection:
        label: Email Connection
        section: 3a. Connection and credentials
        kind: text
        required: true
      connectionVar:
        label: Email Connection Unresolved
        section: 3a. Connection and credentials
        kind: text
        required: cond
      contentProcessingType:
        section: 3d. Body variables and content processing (optional)
        kind: enum
        values:
          None: 0
          Success Body Contains: 1
          Failure Body Contains: 2
          Success Body Does Not Contain: 3
          Failure Body Does Not Contain: 4
        default: None
      expirationAction:
        label: Expiration Action
        section: 3f. Common monitor plumbing
        kind: enum
        values:
          Failed: 1
          Finished: 2
        default: Failed
      filterLogic:
        default: And
      includeReadEmail:
        label: Include Read Mail
        section: 3c. Mailbox and post-action
        kind: boolean
      mailboxFolder:
        label: Mailbox Folder
        section: 3c. Mailbox and post-action
        kind: text
        default: INBOX
        required: true
      mailboxFolderDestination:
        label: Destination Folder
        section: 3c. Mailbox and post-action
        kind: text
        required: cond
      moveToTrash:
        label: Move To Trash
        section: 3c. Mailbox and post-action
        kind: boolean
      sentRestriction:
        section: 3e. Date restrictions (optional)
        kind: enum
        values:
          None: 0
          'On': 1
          Before: 2
          After: 3
          Span: 4
        default: None
