        Success Exitcode Range: 2
        Failure Exitcode Range: 3
        Success Result Set Contains: 4
        Failure Result Set Contains: 5
        Success Output Parameter: 6
        Failure Output Parameter: 7
      group: exit_codes
  distributed_agent_task:
    command:
      label: Command
      category: Command vs Script
      applies_when:
        commandOrScript:
        - Command
        - null
    commandOrScript:
      category: Command vs Script
      kind: enum
      values:
        Command: 1
        Script: 2
      default: Command
      label: Command or Script
    environment:
      label: Environment Variables
      category: Command Execution Options
