# What the Controller supplies when a field is omitted on create, as stated by
# Stonebranch's own create-task documentation.
#
# This is a different claim from a derived template default, which says only
# what one corpus happens to hold -- and only one of the two is measured against
# the objects the round trip has to survive. So a documented default reaches
# `templates/<ver>/<type>.json` ONLY where the corpus says the field is present
# on EVERY instance of that type. That is derivation's own rule
# (`_Accumulator.template`) and it is what keeps `inflate(simplify(x, t), t) ==
# normalize(x)` exact: the simplified form cannot say "unset", so a default for
# a sometimes-absent field is resurrected on the objects that never had it.
# Measured on the case that found it -- giving the five types that lack
# `exitCodes` a default takes the corpus round trip from 5286/5286 to 5268/5286.
#
# A value the gate refuses is still true and still useful: it is prompt
# knowledge and an `oncreate` candidate. It is simply not a template default,
# and `bootstrap derive` says which ones it withheld rather than dropping them
# silently.
#
# Values are spelled the way the API takes them. Enums are STRINGS and are
# written as the value map's *name* ("NONE", "-- System Default --"), never the
# integer id. A field the registry declares `string` is quoted even when it
# looks like a number: `outputReturnSline` is stored as "1" on all 920 taskUnix
# and 179 taskZos objects, and a bare 1 would equal nothing, since the differ
# compares exactly. `resPriority`, `retryMaximum`, `retryInterval`, the Nth
# amounts, `endSeverity` and `pollInterval` are genuinely integers.
#
# `source:` is mandatory. A default nobody can trace back is a default nobody
# can re-check when the next build changes it.
#
# TASKS ONLY. This build documents no trigger fields at all -- there is no
# create-trigger skill or agent, and `trigger` appears only as a concept in
# prompts/base/uc-concepts.md -- so nothing here is scoped to a trigger type,
# and `common:` reaches only the types whose spec declares the field. Two task
# types have no agent doc either (`taskUniversal`, `taskWorkflow`); they take
# the common entries and nothing more.
#
# TOP-LEVEL FIELDS ONLY. The overlay writes a type's own template, so a field
# that lives inside a sub-object has nowhere to go and would be dropped in
# silence by the declaration filter. The build documents defaults for several:
# `notifyType` (taskSap.emailNotification), `logicalOperator`
# (taskApproval.approvalCriteria) and `paramMode` (taskStoredProc.storedProcParams).
# Defaulting those means a sub-template, which is a separate measured change --
# `derive_templates` pools sub-object shapes across all types at once, so one
# wrong default there reaches every type that has the shape. Three more the
# build documents -- `printTime`, `pageArea` and `profileFormat` -- are not in
# the 8.0.2.0 spec at all, and `tests/test_documented.py` fails on any of them.

# Every type whose spec declares the field. Scope is by declaration, exactly as
# `rules/oncreate.yaml` scopes itself, so a release that adds a field to a type
# needs no edit here.
common:
  timeZonePref:
    value: "-- System Default --"
    source: skills/create-task/SKILL.md:146
  resPriority:
    value: 10
    scalar: true
    source: skills/create-task/SKILL.md:149
    note: >-
      Absent from all 27 derived templates, because `reference_fields()` pops
      every field with a `<name>Var` twin and `resPriorityVar` exists. This one
      is an integer 1-100, not the name of another object -- the twin exists
      only so a variable may supply the number -- so `scalar: true` says so in
      the file rather than having the overlay quietly overrule the rule.
  overrideInstanceWait:
    value: "No"
    source: skills/create-task/SKILL.md:154
  retryMaximum:
    value: 0
    source: skills/create-task/SKILL.md:168
    note: Withheld on this corpus -- 0 of 5,286 objects store it.
  retryInterval:
    value: 60
    source: skills/create-task/SKILL.md:170
    note: Withheld on this corpus -- 0 of 5,286 objects store it.
  twWaitType:
    value: "None"
    source: skills/create-task/SKILL.md:183
  twDelayType:
    value: "None"
    source: skills/create-task/SKILL.md:188
  lsType:
    value: Time
    source: skills/create-task/SKILL.md:255
  lsNthAmount:
    value: 5
    source: skills/create-task/SKILL.md:258
  lfType:
    value: Time
    source: skills/create-task/SKILL.md:266
  lfNthAmount:
    value: 5
    source: skills/create-task/SKILL.md:269
  lfOffsetType:
    value: Percentage
    source: skills/create-task/SKILL.md:271
  lfOffsetDurationUnit:
    value: Minutes
    source: skills/create-task/SKILL.md:274
  efType:
    value: Time
    source: skills/create-task/SKILL.md:281
  efNthAmount:
    value: 5
    source: skills/create-task/SKILL.md:284
  efOffsetType:
    value: Percentage
    source: skills/create-task/SKILL.md:286
  efOffsetDurationUnit:
    value: Minutes
    source: skills/create-task/SKILL.md:289
  cpDurationUnit:
    value: Minutes
    source: skills/create-task/SKILL.md:305
  executionRestriction:
    value: "None"
    source: skills/create-task/SKILL.md:313

  # The shared skills. Narrower than they look: only the distributed-agent
  # types declare `commandOrScript`, and only the two database types
  # `resultProcessing`, so declaration alone scopes them correctly.
  commandOrScript:
    value: Command
    source: skills/create-distributed-agent-task/SKILL.md:51
  exitCodeProcessing:
    value: Success Exitcode Range
    source: skills/create-distributed-agent-task/SKILL.md:164
  outputReturnType:
    value: NONE
    source: skills/create-distributed-agent-task/SKILL.md:263
    note: >-
      Disputed on taskPeoplesoft, where all 10 corpus objects hold OUTERR and
      NONE occurs on none of them -- so it is withheld there and applied
      everywhere else. SAP and Universal Command document OUTERR outright and
      say so under `types:` below; PeopleSoft may be the same case undocumented,
      which is exactly what a human should check against a controller rather
      than what an overlay should guess.
  outputReturnSline:
    value: "1"
    source: skills/create-distributed-agent-task/SKILL.md:271
    note: >-
      Stored as the string "1", never the number. Withheld on taskUnix (920/939)
      and taskWindows (146/168), where the field is not on every instance.
  resultProcessing:
    value: Skip Result Processing
    source: skills/create-database-task/SKILL.md:60

