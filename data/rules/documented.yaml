# Fields the Controller rejects outright. Not defaults -- the opposite: there is
# no value that may be sent, because these are UI-only toggles UAC derives from
# whether the matching `*Var` field is set.
#
# A pattern rather than a list, because UAC grows one per reference field and a
# list is wrong the week a release adds a pair. Measured: not one `*VarCheck`
# name occurs in registry/types.yaml, so nothing derived can emit one -- but a
# bundle's flat body passes unknown keys straight through by design, which is
# exactly how one reaches the controller and comes back `Unrecognized property`.
never_send:
  patterns: ["*VarCheck"]
  fields:
    - useSapConnectionVar
    - useConnectionVar
  why: >-
    UI-only var-check toggles. The Controller derives the "use the variable"
    state from whether the `*Var` field is set, and rejects these as
    `Unrecognized property`.
  source: skills/create-task/SKILL.md:114
